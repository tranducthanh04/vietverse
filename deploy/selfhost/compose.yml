# Vietverse self-host stack. No secrets here: values come from .env in the SAME directory.
#
# Layout on the server (scripts copy this file to ~/vietverse/compose.yml on every run):
#   ~/vietverse/compose.yml   <- this file
#   ~/vietverse/.env          <- secrets, chmod 600 (generated by init.sh from .env.example)
#   ~/vietverse/app/          <- git checkout (build context, mounted mongo scripts)
#   ~/vietverse/backups/      <- daily mongodump archives
# Always run with project name "vietverse" (pinned below); never use global prune commands.
#
# Isolation: only vietverse-web publishes a port, and only on 127.0.0.1:15081.

name: vietverse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # One-shot: creates the replica-set keyfile once (idempotent), owned by mongod (uid 999).
  vietverse-mongo-keyfile:
    image: mongo:7
    container_name: vietverse-mongo-keyfile
    restart: "no"
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - >-
        set -eu;
        f=/keyfile/keyfile;
        if [ ! -s "$$f" ]; then umask 077; tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 756 > "$$f"; echo 'keyfile created'; fi;
        chown 999:999 "$$f"; chmod 400 "$$f"
    volumes:
      - vietverse_mongo_keyfile:/keyfile
    network_mode: none
    mem_limit: 64m
    cpus: 0.5
    logging: *default-logging

  vietverse-mongo:
    image: mongo:7
    container_name: vietverse-mongo
    restart: unless-stopped
    command:
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /data/keyfile/keyfile
      - --wiredTigerCacheSizeGB
      - "1"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME chưa đặt trong .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD chưa đặt trong .env}
    volumes:
      - vietverse_mongo_data:/data/db
      - vietverse_mongo_config:/data/configdb
      - vietverse_mongo_keyfile:/data/keyfile:ro
    depends_on:
      vietverse-mongo-keyfile:
        condition: service_completed_successfully
    # Healthy only once this node is the writable PRIMARY of rs0 (hello needs no auth).
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks: [vietverse_net]
    mem_limit: 2g
    cpus: 2
    logging: *default-logging

  # One-shot: makes the audio volume writable by the API runtime user (node = uid 1000 in the
  # image) and world-readable so the backup container (any VV_UID) can archive it read-only.
  vietverse-audio-init:
    image: mongo:7
    container_name: vietverse-audio-init
    restart: "no"
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - >-
        set -eu;
        mkdir -p /data/audio/recordings /data/audio/content;
        chown -R 1000:1000 /data/audio;
        chmod -R u=rwX,go=rX /data/audio;
        echo 'audio volume ready'
    volumes:
      - vietverse_audio:/data/audio
    network_mode: none
    mem_limit: 64m
    cpus: 0.5
    logging: *default-logging

  # One-shot on every `up`: rs.initiate (once) + create/update app and backup users.
  vietverse-mongo-init:
    image: mongo:7
    container_name: vietverse-mongo-init
    restart: "no"
    entrypoint: ["mongosh", "--nodb", "--quiet", "--norc", "/scripts/init-replica.js"]
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME chưa đặt trong .env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD chưa đặt trong .env}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-vietverse_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD chưa đặt trong .env}
      MONGO_BACKUP_USERNAME: ${MONGO_BACKUP_USERNAME:-vietverse_backup}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?MONGO_BACKUP_PASSWORD chưa đặt trong .env}
    volumes:
      - ./app/deploy/selfhost/mongo/init-replica.js:/scripts/init-replica.js:ro
    depends_on:
      vietverse-mongo:
        condition: service_started
    networks: [vietverse_net]
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  vietverse-api:
    build:
      context: ./app
      dockerfile: deploy/selfhost/api.Dockerfile
    image: vietverse/api:${VIETVERSE_TAG:-latest}
    container_name: vietverse-api
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    # Explicit list instead of env_file: the API must not see Mongo root/backup credentials.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      SELF_HOSTED: ${SELF_HOSTED:-1}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN chưa đặt trong .env}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-}
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:-vietverse_app}:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD chưa đặt trong .env}@vietverse-mongo:27017/vietverse?replicaSet=rs0&authSource=vietverse
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chưa đặt trong .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET chưa đặt trong .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CMS_PUBLISH_ENABLED: ${CMS_PUBLISH_ENABLED:-false}
      # All audio (child recordings + content narration) lives on this durable volume.
      AUDIO_STORAGE_DIR: /data/audio
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_IMAGE_UPLOAD_PRESET: ${CLOUDINARY_IMAGE_UPLOAD_PRESET:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
    volumes:
      - vietverse_audio:/data/audio
    depends_on:
      vietverse-mongo:
        condition: service_healthy
      vietverse-mongo-init:
        condition: service_completed_successfully
      vietverse-audio-init:
        condition: service_completed_successfully
    # Healthcheck is defined in api.Dockerfile (GET http://127.0.0.1:5000/health).
    networks: [vietverse_net]
    mem_limit: 1g
    cpus: 2
    logging: *default-logging

  vietverse-web:
    build:
      context: ./app
      dockerfile: deploy/selfhost/web.Dockerfile
    image: vietverse/web:${VIETVERSE_TAG:-latest}
    container_name: vietverse-web
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:15081:80"
    depends_on:
      vietverse-api:
        condition: service_healthy
    # Healthcheck is defined in web.Dockerfile (GET /index.html, independent of the API).
    networks: [vietverse_net]
    mem_limit: 256m
    cpus: 1
    logging: *default-logging

  vietverse-backup:
    image: mongo:7
    container_name: vietverse-backup
    restart: unless-stopped
    # Run as the host owner so archives in ./backups are owned by anhduong, not root.
    user: "${VV_UID:-1000}:${VV_GID:-1000}"
    entrypoint: ["sh", "/scripts/backup-loop.sh"]
    environment:
      MONGO_BACKUP_USERNAME: ${MONGO_BACKUP_USERNAME:-vietverse_backup}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?MONGO_BACKUP_PASSWORD chưa đặt trong .env}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # Directory inside the backup container where the audio volume is mounted (read-only).
      AUDIO_SRC: /audio
      # POSIX TZ string (UTC+7) works without tzdata in the image.
      TZ: ICT-7
    volumes:
      - ./backups:/backups
      - ./app/deploy/selfhost/mongo:/scripts:ro
      - vietverse_audio:/audio:ro
    depends_on:
      vietverse-mongo:
        condition: service_healthy
      vietverse-mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "[ ! -f /tmp/vv-backup-failed ] && find /tmp/vv-backup-alive -mmin -20 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 1m
    networks: [vietverse_net]
    mem_limit: 512m
    cpus: 1
    logging: *default-logging

networks:
  vietverse_net:
    name: vietverse_net
    driver: bridge

volumes:
  vietverse_mongo_data:
    name: vietverse_mongo_data
  vietverse_mongo_config:
    name: vietverse_mongo_config
  vietverse_mongo_keyfile:
    name: vietverse_mongo_keyfile
  # Durable audio: child recordings and content narration. Backed up daily as tar.gz.
  vietverse_audio:
    name: vietverse_audio
