# vietverse-web: replaces /etc/nginx/conf.d/default.conf (included inside the http {} block).
# Chain: browser -> host nginx (TLS, vietverse.io.vn) -> 127.0.0.1:15081 -> this server -> vietverse-api:5000.
# The API trusts exactly 2 proxy hops (TRUST_PROXY_HOPS=2): host nginx + this nginx.

# Keep the scheme the host nginx saw; default to https (the public site is HTTPS-only).
map $http_x_forwarded_proto $vv_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Docker's embedded DNS: re-resolve vietverse-api so a recreated API container
    # (new IP) is picked up without restarting this container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vv_api http://vietverse-api:5000;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/xml;

    # SPA: unknown paths fall back to index.html (client-side routes like /dang-nhap).
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The app shell must always be revalidated so a deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Content-hashed Vite bundles: cache forever; a missing asset is a real 404 (no SPA fallback,
    # otherwise an old tab would receive index.html as JavaScript).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # API: security headers come from helmet in the API itself.
    location /api/ {
        client_max_body_size 6m;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vv_forwarded_proto;
        # Variable upstream: the original request URI (/api/...) is passed unchanged.
        proxy_pass $vv_api;
    }

    # External uptime monitoring: https://vietverse.io.vn/healthz -> API /health.
    location = /healthz {
        access_log off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        rewrite ^ /health break;
        proxy_pass $vv_api;
    }
}
