# Vietverse — host nginx site (the ONLY file Vietverse adds under /etc).
# Owner installs it with sudo (see docs/self-host-deployment.md):
#   sudo cp ~/vietverse/app/deploy/selfhost/host-nginx/vietverse.conf /etc/nginx/sites-available/vietverse.conf
#   sudo ln -s /etc/nginx/sites-available/vietverse.conf /etc/nginx/sites-enabled/vietverse.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vietverse.io.vn -d www.vietverse.io.vn
# HTTP only for now; certbot adds the 443 listeners/certificates and the HTTP->HTTPS redirect
# to this file only.
# listen: IPv4 only; add "listen [::]:80;" if booking.conf (existing style) also listens on IPv6.
# Everything (SPA + /api) is served by the vietverse-web container on 127.0.0.1:15081.

# www -> apex (one canonical origin = CLIENT_ORIGIN, so cookies/Google origin stay simple).
server {
    listen 80;
    server_name www.vietverse.io.vn;
    return 301 $scheme://vietverse.io.vn$request_uri;
}

server {
    listen 80;
    server_name vietverse.io.vn;

    # Signed audio/image uploads go browser -> Cloudinary; API bodies stay small.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:15081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This nginx is the edge: overwrite (do not append) any client-supplied XFF.
        # The API trusts 2 hops (this nginx + vietverse-web), see TRUST_PROXY_HOPS.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
